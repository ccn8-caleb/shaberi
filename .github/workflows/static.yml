# Checks on every push/PR; deploys site/ to GitHub Pages from master.
name: Deploy static content to Pages

# Branches: feature branches → development (checked, not deployed) → master (deployed).
on:
  push:
    branches: ["master", "development"]
  pull_request:
    branches: ["master", "development"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Engine tests
        run: node --test tests/*.test.mjs
      - name: Check changelog has the app version
        run: |
          ver=$(sed -nE "s/^export const APP_VERSION = '([^']+)';/\1/p" site/js/core/version.js)
          echo "APP_VERSION=$ver"
          grep -q "^## \[$ver\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$ver]' entry"; exit 1; }

  build:
    needs: lint
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      # Versioned asset URLs and the service worker's version + offline precache list.
      - name: Stamp deploy
        run: tools/stamp-deploy.sh site "${GITHUB_SHA::12}"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './site'

  # Separate job: deploy-pages can miss an artifact uploaded moments earlier in the
  # same job (actions/deploy-pages#451).
  deploy:
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
